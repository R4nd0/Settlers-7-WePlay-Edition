name: Native Linux host tools

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'tools/linux/**'
      - 'tools/installer/**'
      - 'tools/desktop/**'
      - 'tools/lan/**'
      - 'tools/easytier/**'
      - 'tools/discord-worker/**'
      - 'native/**'
      - 'tools/offline-ui/launch_local.py'
      - 'tests/**'
      - 'S7Patcher.csproj'
      - '.github/workflows/Linux.yml'

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Launcher persistence, integrity and update regressions
        shell: pwsh
        run: |
          $scratch = Join-Path $PWD 'work/ci-launcher-tests'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:S7_TEST_TEMP_ROOT = $scratch
          $env:TEMP = $scratch
          $env:TMP = $scratch
          foreach ($test in @('test_desktop_backend.py','test_update_client.py',
                              'test_desktop_resilience.py',
                              'test_update_resilience.py',
                              'test_update_backend.py','test_update_recovery.py',
                              'test_graphics_profile.py','test_graphics_choice.py',
                              'test_standalone.py','test_network_content.py')) {
            python -B -m unittest discover -s tests -p $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Build launcher and exercise UI and owned child lifetimes
        shell: pwsh
        run: |
          dotnet publish tools/desktop/S7Launcher.csproj -c Release -r win-x64 --self-contained false `
            "-p:BaseIntermediateOutputPath=$PWD/work/ci-launcher-obj/" `
            "-p:BaseOutputPath=$PWD/work/ci-launcher-bin/" -o work/ci-launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          $env:S7_TEST_PRIVATE_PROBE = Join-Path $PWD 'tests/private_channel_probe.py'
          $env:S7_TEST_PYTHON = (Get-Command python).Source
          dotnet work/ci-launcher/S7Launcher.dll --self-test work/ci-launcher-selftest
          if ($LASTEXITCODE -ne 0) { throw 'Launcher UI/process regression failed' }
          dotnet run --project tests/LauncherBackendTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher owned-child lifecycle failed' }
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build guarded x86 adapter and synthetic regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory work | Out-Null
          ./native/build.ps1 -OutputDirectory "$PWD/work/ci-native" -GameDirectory -NeoLogistics
          foreach ($name in @('public_key_tests','cpu_affinity_tests','map_template_tests','network_guard_tests',
                              'bootstrap_patch_tests','steam_profile_tests','game_directory_bridge_tests',
                              'neo_workshop_tests','neo_distance_tests','neo_logistics_tests','neo_fifo_policy_tests')) {
            & "$PWD/work/ci-native/$name.exe"
            if ($LASTEXITCODE -ne 0) { throw "$name failed" }
          }
          ./native/build_atmosphere.ps1 -OutputDirectory "$PWD/work/ci-atmosphere"
      - name: Public host startup and readiness regressions
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p test_public_startup.py
          if ($LASTEXITCODE -ne 0) { throw 'Public host startup failed' }
          python -B -m unittest discover -s tests -p test_internet_backend.py
          if ($LASTEXITCODE -ne 0) { throw 'Internet guest alignment failed' }
          python -B -m unittest discover -s tests -p test_midsummer.py -k ReShadePreparationTests
          if ($LASTEXITCODE -ne 0) { throw 'ReShade preset lifecycle failed' }
  host:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Public directory lifecycle and host startup regressions
        shell: bash
        run: |
          mkdir -p work
          node --test tools/discord-worker/tests/*.test.mjs
          python3 -B -m unittest discover -s tests -p test_public_startup.py
          python3 -B -m unittest discover -s tests -p test_launch_internet.py
          python3 -B -m unittest discover -s tests -p test_midsummer.py -k ReShadePreparationTests
      - name: Build native service and join helper
        shell: bash
        run: |
          mkdir -p work
          sh tools/linux/build.sh "$PWD/work/ci-linux"
      - name: Build and check the canonical archive compressor
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/zlib-ng/zlib-ng/archive/refs/tags/2.2.4.tar.gz \
            --output work/zlib-ng-2.2.4.tar.gz
          sh tools/linux/build_compressor.sh work/zlib-ng-2.2.4.tar.gz "$PWD/work/ci-compressor"
          WEPLAY_TEST_COMPRESSION="$PWD/work/ci-compressor/runtime/libweplay-zlib.so" \
            python3 -B -m unittest discover -s tests -p test_canonical_native.py
      - name: Linux copy, path, lock and runtime boundaries
        shell: bash
        run: |
          python3 -B -m unittest discover -s tests -p test_linux_support.py
          python3 -B -m unittest discover -s tests -p test_linux_replays.py
          python3 -B -m unittest discover -s tests -p test_installer.py
          python3 -B -m unittest discover -s tests -p test_graphics_profile.py
      - name: Real HTTP/UDP and independent OpenSSL peer
        shell: bash
        run: |
          dotnet run --project tests/ConfigServerTests -c Release -- \
            "$(command -v dotnet)" "$PWD/work/ci-linux/server/S7Patcher.dll"
